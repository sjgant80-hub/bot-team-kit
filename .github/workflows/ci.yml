name: ci
on:
  push:
  pull_request:
jobs:
  test-and-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # the measurement reads the first build's code and the seal's commit from git
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: tests — the first build's suite (fuzz, flag branches, golden), the kernel, I/O, cost case, pins, page check
        run: node --test test/test.mjs test/kernel.test.mjs test/io.test.mjs test/mintcase.test.mjs test/pins.test.mjs test/page.test.mjs test/claims.test.mjs
      - name: the curated mutation gate (G2) — its list may grow, never shrink
        run: node gate.mjs
      - name: witness v0.6 (pinned tag) on every organ (G1) — clean or the job fails
        run: |
          git clone --depth 1 --branch v0.6 https://github.com/sjgant80-hub/witness.git /tmp/witness6
          mkdir -p /tmp/w
          gate() {
            node /tmp/witness6/witness.mjs mutate "src/$1.mjs" --timeout 180000 --cap 800 --test node --test $2 > "/tmp/w/$1.json" \
              || { echo "::error::mutants survived in src/$1.mjs"; cat "/tmp/w/$1.json"; exit 1; }
          }
          gate kernel "test/test.mjs test/kernel.test.mjs"
          gate feed "test/io.test.mjs"
          gate rollup "test/io.test.mjs"
          gate mintcase "test/mintcase.test.mjs"
      - name: witness v0.6 on the page's own modules (CLAIMS-1c G3) — clean or the job fails
        run: |
          kgate() {
            node /tmp/witness6/witness.mjs mutate "$1" --timeout 30000 --cap 800 --test node --test $2 > "/tmp/w/$3.json" \
              || { echo "::error::mutants survived in $1"; cat "/tmp/w/$3.json"; exit 1; }
          }
          kgate page/facts.mjs "test/page.test.mjs" facts
          kgate tools/verdicts.mjs "test/claims.test.mjs" verdicts
          kgate tools/page-rules.mjs "test/page.test.mjs" page-rules
      - name: the one baselined survivor is checked, not argued — the exact mutant against the real rules, exhaustively
        run: node test/equivalence-1c.mjs
      - name: witness v0.6 on the same modules before CLAIMS-1c, with that commit's tests (G4) — recorded only
        run: |
          mkdir -p /tmp/before1c
          git archive f1d8e7038b7f0d05f922eb939550d932edb928b0 | tar -x -C /tmp/before1c
          cd /tmp/before1c
          before() {
            node /tmp/witness6/witness.mjs mutate "$1" --timeout 30000 --cap 800 --test node --test $2 > "/tmp/w/$3.json" || true
            node -e "const r=require('/tmp/w/$3.json'); if (!(r.total > 0)) { console.error('G4 did not run on $1'); process.exit(1); } console.log('G4 recorded, $1:', r.killed, 'of', r.total, 'killed')"
          }
          before page/facts.mjs "test/page.test.mjs" before-facts
          before tools/claims.mjs "test/claims.test.mjs" before-claims
          before tools/page-check.mjs "test/page.test.mjs" before-page-check
      - name: witness v0.6 on the first build's kernel with the first build's tests (G0) — recorded only, survivors expected
        run: |
          mkdir -p /tmp/step1
          git archive 4c20fd942289916e2a75dd443b83d32c13805c62 src test | tar -x -C /tmp/step1
          cd /tmp/step1
          node /tmp/witness6/witness.mjs mutate src/kernel.mjs --timeout 180000 --cap 800 --test node --test test/test.mjs > /tmp/w/step1-kernel.json || true
          node -e "const r=require('/tmp/w/step1-kernel.json'); if (!(r.total > 0)) { console.error('G0 did not run'); process.exit(1); } console.log('G0 recorded:', r.killed, 'of', r.total, 'killed')"
      - name: receipts/witness.json re-derives from this run's own witness outputs, tests and curated gate
        run: node tools/gates.mjs --witness-dir /tmp/w --check
      - name: receipts/step1b.json re-derives from the sealed batteries and the code (L, F, R)
        run: node tools/measure.mjs --check
      - name: receipts/trace.json re-derives from one real run (T1)
        run: node tools/trace.mjs --check
      - name: the page carries no typed-in number, no price or tier wording, the credits and every section (P1)
        run: node tools/page-check.mjs
      - name: receipts/claims.json re-derives — every claim CLAIMS-1b and CLAIMS-1c seal, each with its verdict against its own seal's bar
        run: node tools/claims.mjs --check
      - name: keep the witness outputs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: witness-outputs
          path: /tmp/w/
