name: ci
on:
  push:
  pull_request:
jobs:
  test-and-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: tests (fuzz + flag branches + golden determinism)
        run: node --test test/test.mjs
      - name: mutation gate (proof-of-play)
        run: node gate.mjs
